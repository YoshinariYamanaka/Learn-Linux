<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="760" height="460" fill="#ffffff"/>
  <!-- Guest -->
  <rect x="20" y="40" width="720" height="110" fill="#dbeafe" stroke="#334155"/>
  <text x="30" y="58" fill="#334155">Guest: VMX non-root mode</text>
  <rect x="240" y="72" width="280" height="58" fill="#fed7aa" stroke="#334155"/>
  <text x="380" y="96" text-anchor="middle">guest kernel (ring 0)</text>
  <text x="380" y="116" text-anchor="middle" font-size="12">and applications (ring 3)</text>
  <!-- Hypervisor -->
  <rect x="20" y="190" width="720" height="110" fill="#fecaca" stroke="#334155"/>
  <text x="30" y="208" fill="#334155">Hypervisor: VMX root mode</text>
  <rect x="240" y="218" width="280" height="58" fill="#ffffff" stroke="#334155"/>
  <text x="380" y="252" text-anchor="middle" font-weight="bold">hypervisor</text>
  <rect x="580" y="218" width="140" height="58" fill="#fef9c3" stroke="#334155"/>
  <text x="650" y="240" text-anchor="middle" font-weight="bold">VMCS</text>
  <text x="650" y="256" text-anchor="middle" font-size="11">guest state,</text>
  <text x="650" y="270" text-anchor="middle" font-size="11">exit conditions</text>
  <!-- Hardware -->
  <rect x="20" y="330" width="720" height="50" fill="#e2e8f0" stroke="#334155"/>
  <text x="380" y="360" text-anchor="middle">Hardware: CPU with VT-x switches between the two modes</text>
  <!-- ① hypervisor -> VMCS -->
  <line x1="520" y1="236" x2="578" y2="236" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="549" y="230" text-anchor="middle" font-size="12">①</text>
  <!-- ④ VMCS -> hypervisor -->
  <line x1="580" y1="260" x2="522" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="549" y="290" text-anchor="middle" font-size="12">④</text>
  <!-- ② VM entry: up -->
  <line x1="320" y1="218" x2="320" y2="132" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="314" y="170" text-anchor="end" font-size="12">② VM entry</text>
  <text x="314" y="185" text-anchor="end" font-size="11">VMLAUNCH / VMRESUME</text>
  <!-- ③ VM exit: down -->
  <line x1="440" y1="130" x2="440" y2="216" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="446" y="170" font-size="12">③ VM exit</text>
  <text x="446" y="185" font-size="11">CPUID, port I/O, HLT ...</text>
  <!-- legend -->
  <text x="30" y="410" font-size="12" fill="#334155">① The hypervisor writes the guest state and the exit conditions into the VMCS.   ② VM entry: the guest runs at native speed.</text>
  <text x="30" y="430" font-size="12" fill="#334155">③ A watched event causes a VM exit; the CPU saves the guest state into the VMCS.</text>
  <text x="30" y="450" font-size="12" fill="#334155">④ The hypervisor reads the exit reason from the VMCS, handles it, and goes back to ②.</text>
</svg>
